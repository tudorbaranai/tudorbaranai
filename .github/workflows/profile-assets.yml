# Builds the images shown on the profile README (contribution snake and
# time-of-day card) and publishes them to the `output` branch.
# Nothing is committed to main, so README history stays clean.
name: Profile assets

on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC (only runs from the default branch)
  workflow_dispatch:
  push:
    branches: [main, profile-redesign]
    paths: [".github/**"]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

env:
  SNAKE_SLOWDOWN: 3 # 1 = original speed, 3 = three times slower

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#00C02E
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00C02E

      - name: Slow the snake down
        # Every animation in the SVG shares one duration; stretching it keeps them in sync.
        run: |
          python3 - <<'PY'
          import re, pathlib
          for f in pathlib.Path("dist").glob("github-snake*.svg"):
              svg = f.read_text()
              f.write_text(re.sub(r"(\d+)ms", lambda m: f"{int(m.group(1)) * ${{ env.SNAKE_SLOWDOWN }}}ms", svg))
          PY

      - name: Generate time-of-day card
        run: python3 .github/scripts/coding_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          TIMEZONE: Europe/Bucharest
          OUT_DIR: dist

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
